<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegra.ph 漫画下载器</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg: #1a1d23;
            --surface: #21252b;
            --surface2: #282c34;
            --border: #3a3f4b;
            --text: #e1e4e8;
            --text-secondary: #a0a6b0;
            --accent: #5c9ce6;
            --accent-hover: #4a8ad4;
            --accent-glow: rgba(92, 156, 230, 0.25);
            --danger: #e0556a;
            --success: #4ec990;
            --warning: #e5b567;
            --radius: 12px;
            --radius-sm: 8px;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.25);
            --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', 'Monaco', monospace;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg: #f5f6f8;
                --surface: #ffffff;
                --surface2: #f0f1f4;
                --border: #d8dae0;
                --text: #1a1d23;
                --text-secondary: #5a5f6b;
                --accent: #3b7dd8;
                --accent-hover: #2e6bc4;
                --accent-glow: rgba(59, 125, 216, 0.15);
                --danger: #c93a4a;
                --success: #2ea87a;
                --warning: #b8861e;
                --shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
                --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: '';
            position: fixed;
            top: -40%; left: -20%;
            width: 80%; height: 80%;
            background: radial-gradient(ellipse at center, rgba(92, 156, 230, 0.04) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -30%; right: -15%;
            width: 60%; height: 60%;
            background: radial-gradient(ellipse at center, rgba(78, 201, 144, 0.03) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px 20px 60px;
            position: relative;
            z-index: 1;
        }

        .header { text-align: center; padding: 40px 20px 30px; }
        .header .logo {
            display: inline-block;
            font-size: 48px;
            margin-bottom: 8px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            background: linear-gradient(135deg, var(--text) 0%, var(--text-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header .subtitle { font-size: 14px; color: var(--text-secondary); font-weight: 400; }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }
        .card:hover { box-shadow: var(--shadow); }

        .input-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .input-group input {
            flex: 1 1 280px;
            padding: 14px 18px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--surface2);
            color: var(--text);
            font-size: 15px;
            font-family: var(--font-mono);
            transition: var(--transition);
            outline: none;
            min-width: 200px;
        }
        .input-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }
        .input-group input::placeholder { color: var(--text-secondary); opacity: 0.6; font-family: inherit; }

        .btn {
            padding: 14px 24px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
            letter-spacing: 0.3px;
            position: relative;
            overflow: hidden;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover:not(:disabled) { background: var(--accent-hover); box-shadow: 0 6px 20px var(--accent-glow); }
        .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; filter: grayscale(20%); }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text);
        }
        .btn-outline:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-glow); }
        .btn-outline.active {
            border-color: var(--accent);
            background: var(--accent-glow);
            color: var(--accent);
            font-weight: 700;
        }
        .btn-success { background: var(--success); color: #fff; }
        .btn-success:hover:not(:disabled) { filter: brightness(1.1); box-shadow: 0 6px 20px rgba(78, 201, 144, 0.3); }
        .btn-sm { padding: 8px 16px; font-size: 13px; border-radius: 6px; }

        /* 设置面板 */
        .settings-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            padding: 4px 0;
            transition: var(--transition);
        }
        .settings-toggle:hover { color: var(--text); }
        .settings-toggle .chevron {
            transition: transform var(--transition);
            font-size: 12px;
            display: inline-block;
        }
        .settings-toggle.open .chevron { transform: rotate(180deg); }
        .settings-body {
            display: none;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px dashed var(--border);
            animation: fadeIn 0.25s ease;
        }
        .settings-body.open { display: block; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .settings-body label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 6px;
        }
        .settings-body .proxy-input {
            width: 100%;
            padding: 11px 14px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--surface2);
            color: var(--text);
            font-size: 13px;
            font-family: var(--font-mono);
            outline: none;
            transition: var(--transition);
        }
        .settings-body .proxy-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .settings-hint {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 8px;
            line-height: 1.7;
        }
        .settings-hint code {
            background: var(--surface2);
            padding: 1px 6px;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 11px;
        }
        .settings-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            margin-top: 10px;
            padding: 5px 10px;
            border-radius: 6px;
            font-weight: 600;
        }
        .settings-status.on { background: rgba(78, 201, 144, 0.12); color: var(--success); }
        .settings-status.off { background: var(--surface2); color: var(--text-secondary); }

        /* 格式选择 */
        .format-selector { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
        .format-selector .btn {
            flex: 1;
            min-width: 80px;
            text-align: center;
            padding: 12px 16px;
            font-size: 14px;
        }

        /* 信息栏 */
        .info-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 16px;
        }
        .info-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: var(--text-secondary);
        }
        .info-item .icon { font-size: 18px; }
        .info-item strong { color: var(--text); font-weight: 600; }
        .tag {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background: var(--accent-glow);
            color: var(--accent);
        }

        /* 预览网格 */
        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
            max-height: 500px;
            overflow-y: auto;
            padding: 8px 4px;
            scroll-behavior: smooth;
        }
        .preview-grid::-webkit-scrollbar { width: 6px; }
        .preview-grid::-webkit-scrollbar-track { background: transparent; }
        .preview-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        .preview-item {
            position: relative;
            border-radius: var(--radius-sm);
            overflow: hidden;
            aspect-ratio: 3/4;
            background: var(--surface2);
            border: 2px solid transparent;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }
        .preview-item:hover {
            border-color: var(--accent);
            box-shadow: 0 8px 24px var(--accent-glow);
            transform: translateY(-2px);
            z-index: 2;
        }
        .preview-item img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
            transition: var(--transition);
        }
        .preview-item:hover img { scale: 1.05; }
        .preview-item .page-number {
            position: absolute;
            bottom: 6px; right: 6px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 10px;
            pointer-events: none;
        }
        .preview-item .check-overlay {
            position: absolute;
            top: 8px; left: 8px;
            width: 22px; height: 22px;
            border-radius: 50%;
            background: var(--success);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #fff;
            pointer-events: none;
            opacity: 0;
            transform: scale(0.5);
            transition: var(--transition);
        }
        .preview-item.selected .check-overlay { opacity: 1; transform: scale(1); }
        .preview-item.selected { border-color: var(--success); }

        .select-all-row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        /* 进度条 */
        .progress-container { margin-top: 16px; display: none; }
        .progress-container.active { display: block; }
        .progress-bar-wrapper {
            width: 100%;
            height: 10px;
            background: var(--surface2);
            border-radius: 10px;
            overflow: hidden;
            margin: 8px 0;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--success));
            border-radius: 10px;
            transition: width 0.3s ease;
            width: 0%;
        }
        .progress-text {
            font-size: 13px;
            color: var(--text-secondary);
            text-align: center;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 20px; right: 20px;
            padding: 14px 22px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            z-index: 9999;
            animation: slideInRight 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow);
            max-width: 400px;
        }
        .toast.error { background: #4a1a22; color: #fca5b3; border: 1px solid #6b2a35; }
        .toast.success { background: #1a3a2c; color: #7ee8b8; border: 1px solid #2a5a3c; }
        .toast.info { background: #1a2a3a; color: #8ec8f2; border: 1px solid #2a4a5a; }
        .toast.warning { background: #4a3a1a; color: #f2d88e; border: 1px solid #6b552a; }
        @keyframes slideInRight {
            from { transform: translateX(120%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideOutRight {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(120%); opacity: 0; }
        }

        .spinner {
            display: inline-block;
            width: 20px; height: 20px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 640px) {
            .header h1 { font-size: 22px; }
            .header .logo { font-size: 36px; }
            .card { padding: 16px; }
            .input-group input { font-size: 13px; padding: 12px 14px; }
            .btn { padding: 12px 18px; font-size: 13px; }
            .preview-grid {
                grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
                gap: 6px;
                max-height: 360px;
            }
            .preview-item .page-number { font-size: 10px; padding: 1px 6px; bottom: 4px; right: 4px; }
            .format-selector .btn { padding: 10px 12px; font-size: 12px; }
        }

        @media (prefers-color-scheme: dark) {
            .preview-grid::-webkit-scrollbar-thumb { background: #3a3f4b; }
            .preview-grid::-webkit-scrollbar-thumb:hover { background: #4a4f5b; }
        }

        .footer-note {
            text-align: center;
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 32px;
            opacity: 0.7;
        }
        .footer-note a { color: var(--accent); text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">📚</div>
            <h1>Telegra.ph 漫画下载器</h1>
            <p class="subtitle">从 Telegraph 页面提取图片 · 支持 ZIP / CBZ / EPUB</p>
        </div>

        <div class="card">
            <div class="input-group">
                <input
                    type="url"
                    id="urlInput"
                    placeholder="粘贴 Telegra.ph 链接，例如 https://telegra.ph/漫画标题-12-31"
                    autocomplete="off"
                />
                <button class="btn btn-primary" id="fetchBtn" onclick="fetchPage()">
                    🔍 获取漫画
                </button>
            </div>
            <div style="margin-top:8px;font-size:12px;color:var(--text-secondary);">
                💡 也支持 <code>telegra.ph</code> 短链接和带 <code>https://</code> 的完整链接
            </div>
        </div>

        <!-- 高级设置（代理配置） -->
        <div class="card">
            <div class="settings-toggle" id="settingsToggle" onclick="toggleSettings()">
                <span>⚙️ 高级设置（CORS 代理，可选）</span>
                <span class="chevron">▼</span>
            </div>
            <div class="settings-body" id="settingsBody">
                <label for="proxyInput">CORS 代理前缀</label>
                <input
                    type="text"
                    id="proxyInput"
                    class="proxy-input"
                    placeholder="例如：https://your-proxy.workers.dev/?url="
                    autocomplete="off"
                    spellcheck="false"
                />
                <div class="settings-hint">
                    仅当图片<b>直连失败</b>（跨域 / 429 限流）时才会自动使用该代理重试。<br>
                    代理会把完整图片 URL 拼接在前缀之后，因此前缀需包含 <code>?url=</code> 或 <code>?</code>。<br>
                    留空则不使用代理。设置会自动保存在浏览器本地。
                </div>
                <div id="proxyStatus" class="settings-status off">
                    <span>○ 未配置代理</span>
                </div>
            </div>
        </div>

        <!-- 漫画信息卡片 -->
        <div class="card" id="infoCard" style="display:none;">
            <div class="info-bar" id="infoBar"></div>
            <div class="select-all-row">
                <button class="btn btn-sm btn-outline" onclick="selectAll()">✅ 全选</button>
                <button class="btn btn-sm btn-outline" onclick="deselectAll()">⬜ 取消全选</button>
                <span style="font-size:13px;color:var(--text-secondary);" id="selectionCount"></span>
            </div>
            <div class="preview-grid" id="previewGrid"></div>
            <div class="format-selector">
                <button class="btn btn-outline active format-btn" data-format="zip" onclick="selectFormat('zip', this)">📦 ZIP</button>
                <button class="btn btn-outline format-btn" data-format="cbz" onclick="selectFormat('cbz', this)">📖 CBZ</button>
                <button class="btn btn-outline format-btn" data-format="epub" onclick="selectFormat('epub', this)">📱 EPUB</button>
            </div>
            <div style="margin-top:14px; text-align:center;">
                <button class="btn btn-success" id="downloadBtn" onclick="startDownload()" style="min-width:200px;font-size:16px;">
                    ⬇️ 开始下载
                </button>
            </div>
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar-wrapper">
                    <div class="progress-bar-fill" id="progressBar"></div>
                </div>
                <p class="progress-text" id="progressText">准备中...</p>
            </div>
        </div>

        <p class="footer-note">
            所有处理均在浏览器本地完成，图片不会上传到任何服务器 ·
            <a href="https://github.com/loongkc/TphDL" target="_blank" rel="noopener">开源项目，对你有帮助可以请作者喝瓶水</a>
        </p>
    </div>

    <div id="toastContainer"></div>

    <script>
        (function() {
            'use strict';

            // ==================== 常量 ====================
            const STORAGE_KEY_PROXY = 'tph_proxy_prefix_v1';
            const ERROR_PLACEHOLDER = 'data:image/svg+xml,' + encodeURIComponent(
                '<svg xmlns="http://www.w3.org/2000/svg" width="130" height="170">' +
                '<rect width="130" height="170" rx="8" fill="#3a3f4b"/>' +
                '<text x="65" y="90" text-anchor="middle" fill="#a0a6b0" font-size="14">加载失败</text>' +
                '</svg>'
            );
            const DOWNLOAD_TIMEOUT_MS = 30000;
            const DOWNLOAD_CONCURRENCY = 8;
            const PER_STAGE_RETRIES = 2;

            // ==================== 全局状态 ====================
            const state = {
                pageData: null,
                images: [],
                selectedFormat: 'zip',
                selectedIndices: new Set(),
                isDownloading: false,
                proxyPrefix: '',
            };

            // 记录已知需要走代理的主机（同主机后续图片优先走代理）
            const proxyRequiredHosts = new Set();
            // 统计
            let stats = { direct: 0, proxy: 0, failed: 0, previewProxy: 0 };

            // ==================== DOM 引用 ====================
            const $ = (sel) => document.querySelector(sel);
            const $$ = (sel) => document.querySelectorAll(sel);

            const urlInput = $('#urlInput');
            const fetchBtn = $('#fetchBtn');
            const infoCard = $('#infoCard');
            const infoBar = $('#infoBar');
            const previewGrid = $('#previewGrid');
            const selectionCount = $('#selectionCount');
            const downloadBtn = $('#downloadBtn');
            const progressContainer = $('#progressContainer');
            const progressBar = $('#progressBar');
            const progressText = $('#progressText');
            const toastContainer = $('#toastContainer');
            const formatBtns = $$('.format-btn');
            const proxyInput = $('#proxyInput');
            const proxyStatus = $('#proxyStatus');
            const settingsToggle = $('#settingsToggle');
            const settingsBody = $('#settingsBody');

            // ==================== 配置：代理前缀 ====================
            function loadProxyPrefix() {
                try {
                    const v = localStorage.getItem(STORAGE_KEY_PROXY);
                    return v || '';
                } catch (e) {
                    return '';
                }
            }
            function saveProxyPrefix(value) {
                try {
                    if (value) localStorage.setItem(STORAGE_KEY_PROXY, value);
                    else localStorage.removeItem(STORAGE_KEY_PROXY);
                } catch (e) { /* 忽略存储错误（隐私模式等） */ }
            }
            function getProxyPrefix() {
                return state.proxyPrefix;
            }
            function applyProxyPrefix(value) {
                state.proxyPrefix = (value || '').trim();
                updateProxyStatusUI();
            }
            function updateProxyStatusUI() {
                if (state.proxyPrefix) {
                    proxyStatus.className = 'settings-status on';
                    proxyStatus.innerHTML = '<span>● 已启用代理</span>';
                } else {
                    proxyStatus.className = 'settings-status off';
                    proxyStatus.innerHTML = '<span>○ 未配置代理</span>';
                }
            }
            function buildProxyUrl(url) {
                const prefix = getProxyPrefix();
                if (!prefix) return null;
                return prefix + encodeURIComponent(url);
            }

            // ==================== 设置面板交互 ====================
            window.toggleSettings = function() {
                const isOpen = settingsBody.classList.toggle('open');
                settingsToggle.classList.toggle('open', isOpen);
            };

            // ==================== Toast ====================
            function showToast(message, type = 'info') {
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.textContent = message;
                toastContainer.appendChild(toast);
                const removeTimer = setTimeout(() => {
                    toast.style.animation = 'slideOutRight 0.3s ease forwards';
                    toast.addEventListener('animationend', () => toast.remove(), { once: true });
                }, 2800);
                // 若组件被清理则取消定时器
                toast.addEventListener('remove', () => clearTimeout(removeTimer), { once: true });
            }

            // ==================== 格式选择 ====================
            window.selectFormat = function(format, btnEl) {
                state.selectedFormat = format;
                formatBtns.forEach(b => b.classList.remove('active'));
                if (btnEl) btnEl.classList.add('active');
            };

            // ==================== URL 解析 ====================
            function parseTelegraphPath(url) {
                let cleaned = url.trim();
                try {
                    const u = new URL(cleaned);
                    cleaned = u.origin + u.pathname;
                } catch (e) {
                    if (!/^https?:\/\//i.test(cleaned)) cleaned = 'https://' + cleaned;
                    try {
                        const u = new URL(cleaned);
                        cleaned = u.origin + u.pathname;
                    } catch (e2) {
                        return null;
                    }
                }
                try {
                    const u = new URL(cleaned);
                    if (!u.hostname.includes('telegra.ph')) return null;
                    const path = u.pathname.replace(/^\/+/, '').replace(/\/+$/, '');
                    if (!path || path.length < 3) return null;
                    return path;
                } catch (e) {
                    return null;
                }
            }

            // ==================== 获取页面数据 ====================
            window.fetchPage = async function() {
                if (state.isDownloading) {
                    showToast('请等待当前下载完成', 'info');
                    return;
                }

                const rawUrl = urlInput.value.trim();
                if (!rawUrl) {
                    showToast('请输入 Telegra.ph 链接', 'error');
                    urlInput.focus();
                    return;
                }

                const path = parseTelegraphPath(rawUrl);
                if (!path) {
                    showToast('无法解析链接，请确认是有效的 telegra.ph 链接', 'error');
                    return;
                }

                fetchBtn.disabled = true;
                fetchBtn.innerHTML = '<span class="spinner"></span> 获取中...';
                infoCard.style.display = 'none';
                state.pageData = null;
                state.images = [];
                state.selectedIndices = new Set();
                stats = { direct: 0, proxy: 0, failed: 0, previewProxy: 0 };

                try {
                    const apiUrl = `https://api.telegra.ph/getPage?path=${encodeURIComponent(path)}&return_content=true`;
                    const response = await fetchWithTimeout(apiUrl, 20000);
                    if (!response.ok) throw new Error(`API 返回错误 (${response.status})`);

                    const data = await response.json();
                    if (!data.ok || !data.result) throw new Error('页面不存在或无法访问');

                    state.pageData = data.result;
                    extractImages(data.result);
                    renderInfo();
                    renderPreview();
                    infoCard.style.display = 'block';
                    infoCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    updateSelectionUI();

                    if (state.images.length === 0) {
                        showToast('⚠️ 该页面没有找到图片', 'warning');
                    } else {
                        showToast(`✅ 成功获取！共找到 ${state.images.length} 张图片`, 'success');
                    }
                } catch (err) {
                    console.error('获取页面失败:', err);
                    let msg = '获取失败：';
                    if (err.name === 'AbortError') msg += '请求超时，请稍后重试';
                    else if (err.message.includes('API 返回错误')) msg += err.message;
                    else if (err.message.includes('页面不存在')) msg += '页面不存在或已被删除';
                    else if (err.name === 'TypeError') msg += '网络连接失败，请检查网络或稍后重试';
                    else msg += err.message;
                    showToast(msg, 'error');
                } finally {
                    fetchBtn.disabled = false;
                    fetchBtn.innerHTML = '🔍 获取漫画';
                }
            };

            // ==================== 提取图片 ====================
            function extractImages(pageData) {
                const images = [];
                const content = pageData.content || [];

                function traverse(nodes) {
                    if (!nodes || !Array.isArray(nodes)) return;
                    for (const node of nodes) {
                        if (!node || typeof node !== 'object') continue;

                        if (node.tag === 'img' && node.attrs && node.attrs.src) {
                            let src = node.attrs.src;
                            if (src.startsWith('//')) src = 'https:' + src;
                            else if (src.startsWith('/')) src = 'https://telegra.ph' + src;
                            else if (!src.startsWith('http')) src = 'https://telegra.ph/' + src;

                            try {
                                const urlObj = new URL(src);
                                const pathname = urlObj.pathname;
                                const filename = pathname.split('/').pop() || `image_${images.length + 1}.jpg`;
                                const extMatch = filename.match(/\.(jpg|jpeg|png|gif|webp|bmp|svg)(\?|$)/i);
                                const ext = extMatch ? extMatch[1].toLowerCase() : 'jpg';

                                images.push({ url: src, filename, ext, index: images.length });
                            } catch (e) {
                                console.warn('跳过无效图片 URL:', src);
                            }
                        }

                        if (node.children && Array.isArray(node.children)) {
                            traverse(node.children);
                        }
                    }
                }

                traverse(content);

                // 去重
                const seen = new Set();
                const uniqueImages = [];
                for (const img of images) {
                    if (!seen.has(img.url)) {
                        seen.add(img.url);
                        img.index = uniqueImages.length;
                        uniqueImages.push(img);
                    }
                }

                state.images = uniqueImages;
                state.selectedIndices = new Set(state.images.map((_, i) => i));
            }

            // ==================== 渲染信息栏 ====================
            function renderInfo() {
                const pd = state.pageData;
                const title = pd.title || '未命名漫画';
                const author = pd.author_name || '未知作者';
                const imageCount = state.images.length;

                infoBar.innerHTML = `
                    <div class="info-item">
                        <span class="icon">📝</span>
                        <span>标题: <strong>${escapeHtml(title)}</strong></span>
                    </div>
                    <div class="info-item">
                        <span class="icon">✍️</span>
                        <span>作者: <strong>${escapeHtml(author)}</strong></span>
                    </div>
                    <div class="info-item">
                        <span class="tag">${imageCount} 张图片</span>
                    </div>
                `;
            }

            // ==================== 渲染预览 ====================
            function renderPreview() {
                previewGrid.innerHTML = '';
                if (state.images.length === 0) {
                    previewGrid.innerHTML =
                        '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-secondary);">😕 该页面没有找到图片</div>';
                    return;
                }

                const fragment = document.createDocumentFragment();

                state.images.forEach((img, i) => {
                    const item = document.createElement('div');
                    item.className = 'preview-item selected';
                    item.dataset.index = i;
                    item.title = `第 ${i + 1} 页 - ${img.filename}`;
                    item.addEventListener('click', () => toggleImageSelection(i, item));

                    const imgEl = document.createElement('img');
                    imgEl.alt = `Page ${i + 1}`;
                    imgEl.loading = 'lazy';
                    imgEl.decoding = 'async';
                    imgEl.dataset.originalSrc = img.url;
                    imgEl.dataset.proxyRetry = 'false';

                    imgEl.addEventListener('error', function onImgError() {
                        // 已经尝试过代理 → 最终失败
                        if (this.dataset.proxyRetry === 'true') {
                            this.src = ERROR_PLACEHOLDER;
                            return;
                        }
                        // 未配置代理 → 直接显示失败
                        const proxyUrl = buildProxyUrl(this.dataset.originalSrc);
                        if (!proxyUrl) {
                            this.src = ERROR_PLACEHOLDER;
                            return;
                        }
                        // 走代理重试（只重试一次）
                        this.dataset.proxyRetry = 'true';
                        stats.previewProxy++;
                        this.src = proxyUrl;
                    });

                    // 首次加载：直连
                    imgEl.src = img.url;

                    const pageNum = document.createElement('span');
                    pageNum.className = 'page-number';
                    pageNum.textContent = `${i + 1}`;

                    const checkOverlay = document.createElement('span');
                    checkOverlay.className = 'check-overlay';
                    checkOverlay.textContent = '✓';

                    item.appendChild(imgEl);
                    item.appendChild(pageNum);
                    item.appendChild(checkOverlay);
                    fragment.appendChild(item);
                });

                previewGrid.appendChild(fragment);
                updateSelectionUI();
            }

            // ==================== 选择相关 ====================
            function toggleImageSelection(index, itemEl) {
                if (state.selectedIndices.has(index)) {
                    state.selectedIndices.delete(index);
                    if (itemEl) itemEl.classList.remove('selected');
                } else {
                    state.selectedIndices.add(index);
                    if (itemEl) itemEl.classList.add('selected');
                }
                updateSelectionUI();
            }

            window.selectAll = function() {
                state.images.forEach((_, i) => state.selectedIndices.add(i));
                previewGrid.querySelectorAll('.preview-item').forEach(el => el.classList.add('selected'));
                updateSelectionUI();
            };

            window.deselectAll = function() {
                state.selectedIndices.clear();
                previewGrid.querySelectorAll('.preview-item').forEach(el => el.classList.remove('selected'));
                updateSelectionUI();
            };

            function updateSelectionUI() {
                const count = state.selectedIndices.size;
                const total = state.images.length;
                selectionCount.textContent = `已选择 ${count} / ${total} 张图片`;
                downloadBtn.disabled = count === 0 || state.isDownloading;
                downloadBtn.style.opacity = (count === 0 && !state.isDownloading) ? '0.5' : '1';
            }

            // ==================== 下载主流程 ====================
            window.startDownload = async function() {
                if (state.isDownloading) return;
                if (state.selectedIndices.size === 0) {
                    showToast('请至少选择一张图片', 'error');
                    return;
                }

                const selectedImages = state.images.filter((_, i) => state.selectedIndices.has(i));
                if (selectedImages.length === 0) return;

                state.isDownloading = true;
                stats = { direct: 0, proxy: 0, failed: 0, previewProxy: stats.previewProxy };

                downloadBtn.disabled = true;
                fetchBtn.disabled = true;
                downloadBtn.innerHTML = '<span class="spinner"></span> 准备下载...';
                progressContainer.classList.add('active');
                progressBar.style.width = '0%';
                progressText.textContent = '正在下载图片...';

                const format = state.selectedFormat;
                const title = sanitizeFilename(state.pageData?.title || 'telegraph-comic');
                const totalImages = selectedImages.length;

                try {
                    // ============ 第一步：并发下载所有选中图片 ============
                    const downloadedImages = [];
                    const failedImages = [];

                    for (let batchStart = 0; batchStart < totalImages; batchStart += DOWNLOAD_CONCURRENCY) {
                        const batchEnd = Math.min(batchStart + DOWNLOAD_CONCURRENCY, totalImages);
                        const batch = selectedImages.slice(batchStart, batchEnd);

                        const batchResults = await Promise.allSettled(
                            batch.map(async (imgInfo) => {
                                const blob = await downloadImageWithRetry(imgInfo.url, PER_STAGE_RETRIES);
                                return { imgInfo, blob };
                            })
                        );

                        for (const result of batchResults) {
                            if (result.status === 'fulfilled' && result.value.blob) {
                                downloadedImages.push({ ...result.value.imgInfo, blob: result.value.blob });
                            } else if (result.status === 'fulfilled') {
                                failedImages.push(result.value.imgInfo);
                            } else {
                                // Promise 被 reject（理论上不应出现）
                                console.warn('下载任务异常:', result.reason);
                            }
                        }

                        const downloadProgress = Math.min((batchEnd / totalImages) * 40, 40);
                        progressBar.style.width = downloadProgress + '%';
                        progressText.textContent =
                            `下载图片中... ${Math.min(batchEnd, totalImages)} / ${totalImages}` +
                            (stats.proxy > 0 ? `（代理 ${stats.proxy}）` : '');

                        if (batchEnd < totalImages) await sleep(120);
                    }

                    stats.failed = failedImages.length;

                    if (downloadedImages.length === 0) {
                        throw new Error('所有图片下载失败，请检查网络或图片是否可访问');
                    }

                    if (failedImages.length > 0) {
                        showToast(
                            `⚠️ ${failedImages.length} 张图片下载失败，将继续打包剩余的 ${downloadedImages.length} 张`,
                            'warning'
                        );
                    }

                    // ============ 第二步：打包 ============
                    progressBar.style.width = '45%';
                    progressText.textContent = '正在打包文件...';

                    const packProgressCb = (label) => (packProgress) => {
                        const overall = 45 + packProgress * 0.55;
                        progressBar.style.width = Math.min(overall, 100) + '%';
                        progressText.textContent = `正在生成 ${label}... ${Math.round(packProgress * 100)}%`;
                    };

                    let blob, fileExtension;
                    if (format === 'epub') {
                        blob = await createEpub(title, downloadedImages, packProgressCb('EPUB'));
                        fileExtension = 'epub';
                    } else if (format === 'cbz') {
                        blob = await createZip(downloadedImages, packProgressCb('CBZ'));
                        fileExtension = 'cbz';
                    } else {
                        blob = await createZip(downloadedImages, packProgressCb('ZIP'));
                        fileExtension = 'zip';
                    }

                    progressBar.style.width = '100%';
                    progressText.textContent = '✅ 打包完成！正在触发下载...';

                    const safeTitle = sanitizeFilename(title);
                    const finalFilename = `${safeTitle}.${fileExtension}`;
                    triggerDownload(blob, finalFilename);

                    // 组装提示信息
                    let summary = `🎉 下载已开始！共 ${downloadedImages.length} 张图片`;
                    const extras = [];
                    if (stats.proxy > 0) extras.push(`代理下载 ${stats.proxy} 张`);
                    if (stats.failed > 0) extras.push(`失败 ${stats.failed} 张`);
                    if (extras.length) summary += `（${extras.join('，')}）`;
                    showToast(summary, 'success');

                    await sleep(800);
                    progressText.textContent = '✅ 完成！';

                } catch (err) {
                    console.error('下载失败:', err);
                    showToast('下载失败：' + (err.message || '未知错误'), 'error');
                    progressText.textContent = '❌ 下载失败';
                } finally {
                    state.isDownloading = false;
                    downloadBtn.disabled = false;
                    fetchBtn.disabled = false;
                    downloadBtn.innerHTML = '⬇️ 开始下载';
                    updateSelectionUI();
                    setTimeout(() => {
                        if (!state.isDownloading) {
                            progressContainer.classList.remove('active');
                            progressBar.style.width = '0%';
                        }
                    }, 2000);
                }
            };

            // ==================== 网络工具 ====================
            function fetchWithTimeout(url, timeoutMs, options = {}) {
                // 优先使用 AbortSignal.timeout（现代浏览器）
                if (typeof AbortSignal !== 'undefined' && typeof AbortSignal.timeout === 'function') {
                    return fetch(url, { ...options, signal: AbortSignal.timeout(timeoutMs) });
                }
                // 降级方案
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), timeoutMs);
                return fetch(url, { ...options, signal: controller.signal }).finally(() => clearTimeout(timer));
            }

            function getHostOf(url) {
                try { return new URL(url).host; } catch (e) { return ''; }
            }

            /**
             * 获取单张图片的 Blob。失败时抛出带 status 的 Error。
             * @param {string} url 图片原始地址
             * @param {string|null} proxyPrefix 代理前缀（null 表示直连）
             */
            async function fetchImageBlob(url, proxyPrefix) {
                const target = proxyPrefix ? proxyPrefix + encodeURIComponent(url) : url;
                const response = await fetchWithTimeout(target, DOWNLOAD_TIMEOUT_MS, { mode: 'cors' });

                if (!response.ok) {
                    const err = new Error(`HTTP ${response.status}`);
                    err.status = response.status;
                    throw err;
                }

                const blob = await response.blob();
                if (!blob || blob.size === 0) throw new Error('响应内容为空');
                // 校验类型：真正图片的 content-type 不会以 text/ 开头
                if (blob.type && /^text\//i.test(blob.type)) {
                    throw new Error('返回内容不是图片（可能是错误页）');
                }
                // 前端简单校验图片魔数（jpg / png / gif / webp / bmp）
                if (!looksLikeImage(blob)) {
                    throw new Error('响应内容不是有效图片');
                }
                return blob;
            }

            // 读取 blob 头部若干字节做魔数校验，避免把 HTML/JSON 存成图片
            async function looksLikeImage(blob) {
                try {
                    const head = new Uint8Array(await blob.slice(0, 12).arrayBuffer());
                    // JPEG: FF D8 FF
                    if (head[0] === 0xFF && head[1] === 0xD8 && head[2] === 0xFF) return true;
                    // PNG: 89 50 4E 47
                    if (head[0] === 0x89 && head[1] === 0x50 && head[2] === 0x4E && head[3] === 0x47) return true;
                    // GIF: 47 49 46
                    if (head[0] === 0x47 && head[1] === 0x49 && head[2] === 0x46) return true;
                    // BMP: 42 4D
                    if (head[0] === 0x42 && head[1] === 0x4D) return true;
                    // WebP: 52 49 46 46 ... 57 45 42 50
                    if (head[0] === 0x52 && head[1] === 0x49 && head[2] === 0x46 && head[3] === 0x46 &&
                        head[8] === 0x57 && head[9] === 0x45 && head[10] === 0x42 && head[11] === 0x50) return true;
                    // SVG: 以 "<svg" 或 "<?xml" 开头（文本型）
                    if (blob.type === 'image/svg+xml') return true;
                    // 无法识别时放行（避免误杀某些少见格式），但若 content-type 是 text/* 已在上面拒绝
                    return true;
                } catch (e) {
                    return true; // 读取失败时放行，交给后续流程
                }
            }

            /**
             * 单张图片下载：直连优先，失败时（若配置了代理）走代理重试。
             * 若主机已知需要代理，则优先代理。
             */
            async function downloadImageWithRetry(url, perStageRetries) {
                const host = getHostOf(url);
                const proxyPrefix = getProxyPrefix();

                // 决定尝试顺序
                let order;
                if (host && proxyRequiredHosts.has(host) && proxyPrefix) {
                    order = [proxyPrefix, null];      // 已知需代理：先代理
                } else if (proxyPrefix) {
                    order = [null, proxyPrefix];      // 默认：先直连，失败再代理
                } else {
                    order = [null];                   // 无代理：仅直连
                }

                let lastErr = null;

                for (let stage = 0; stage < order.length; stage++) {
                    const useProxy = order[stage];
                    const isLastStage = stage === order.length - 1;

                    for (let attempt = 0; attempt < perStageRetries; attempt++) {
                        try {
                            const blob = await fetchImageBlob(url, useProxy);
                            // 成功：统计与记忆
                            if (useProxy) {
                                if (host) proxyRequiredHosts.add(host);
                                stats.proxy++;
                            } else {
                                stats.direct++;
                            }
                            return blob;
                        } catch (err) {
                            lastErr = err;
                            const isLastAttempt = isLastStage && attempt === perStageRetries - 1;
                            if (isLastAttempt) break;

                            // 429 限流：退避更长；其余错误：线性退避
                            const delay = err.status === 429
                                ? 1500 * (attempt + 1)
                                : 500 * (attempt + 1);
                            await sleep(delay);
                        }
                    }
                }

                console.warn(`图片下载最终失败 (${url}):`, lastErr && lastErr.message);
                stats.failed++;
                return null;
            }

            // ==================== 创建 ZIP / CBZ ====================
            async function createZip(imagesWithBlobs, progressCallback) {
                const zip = new JSZip();
                const total = imagesWithBlobs.length;
                const padding = String(total).length;

                for (let i = 0; i < total; i++) {
                    const img = imagesWithBlobs[i];
                    const pageNum = String(i + 1).padStart(padding, '0');
                    const ext = img.ext || 'jpg';
                    zip.file(`${pageNum}.${ext}`, img.blob);
                    if (progressCallback && i % 5 === 0) progressCallback(i / total * 0.5);
                }

                return await zip.generateAsync(
                    {
                        type: 'blob',
                        compression: 'DEFLATE',
                        compressionOptions: { level: 6 },
                    },
                    (meta) => {
                        if (progressCallback && meta.percent) {
                            progressCallback(0.5 + (meta.percent / 100) * 0.5);
                        }
                    }
                );
            }

            // ==================== 创建 EPUB ====================
            async function createEpub(title, imagesWithBlobs, progressCallback) {
                const zip = new JSZip();
                const total = imagesWithBlobs.length;
                const padding = String(total).length;
                const uuid = generateUUID();
                const safeTitle = escapeXml(title);

                // 1. mimetype（不压缩，必须第一个）
                zip.file('mimetype', 'application/epub+zip', { compression: 'STORE' });

                // 2. META-INF/container.xml
                const containerXml = `<?xml version="1.0" encoding="UTF-8"?>
<container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container">
    <rootfiles>
        <rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/>
    </rootfiles>
</container>`;
                zip.folder('META-INF').file('container.xml', containerXml);

                // 3. OEBPS 目录
                const oebps = zip.folder('OEBPS');
                const imagesFolder = oebps.folder('images');

                const imageEntries = [];
                for (let i = 0; i < total; i++) {
                    const img = imagesWithBlobs[i];
                    const pageNum = String(i + 1).padStart(padding, '0');
                    const ext = img.ext || 'jpg';
                    const imgFilename = `img_${pageNum}.${ext}`;
                    const imgPath = `images/${imgFilename}`;

                    imagesFolder.file(imgFilename, img.blob);
                    imageEntries.push({
                        id: `img${pageNum}`,
                        href: imgPath,
                        mediaType: getMimeType(ext),
                        pageNum,
                    });

                    if (progressCallback && i % 5 === 0) {
                        progressCallback((i / total) * 0.4);
                    }
                }

                // 4. XHTML 页面
                const pageEntries = [];
                for (let i = 0; i < total; i++) {
                    const imgEntry = imageEntries[i];
                    const pageFilename = `page_${imgEntry.pageNum}.xhtml`;

                    const xhtmlContent = `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops">
<head>
    <title>第 ${i + 1} 页</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <style>
        body { margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #fff; }
        img { max-width: 100%; max-height: 100vh; object-fit: contain; display: block; }
        @media (prefers-color-scheme: dark) { body { background: #1a1a1a; } }
    </style>
</head>
<body>
    <div style="text-align:center;">
        <img src="${imgEntry.href}" alt="第 ${i + 1} 页"/>
    </div>
</body>
</html>`;

                    oebps.file(pageFilename, xhtmlContent);
                    pageEntries.push({
                        id: `page${imgEntry.pageNum}`,
                        href: pageFilename,
                        mediaType: 'application/xhtml+xml',
                    });

                    if (progressCallback && i % 5 === 0) {
                        progressCallback(0.4 + (i / total) * 0.25);
                    }
                }

                // 5. content.opf
                const manifestItems = [
                    ...pageEntries.map(p => `<item id="${p.id}" href="${p.href}" media-type="${p.mediaType}"/>`),
                    ...imageEntries.map(img => `<item id="${img.id}" href="${img.href}" media-type="${img.mediaType}"/>`),
                ].join('\n        ');

                const spineItems = pageEntries.map(p => `<itemref idref="${p.id}"/>`).join('\n        ');

                const contentOpf = `<?xml version="1.0" encoding="UTF-8"?>
<package xmlns="http://www.idpf.org/2007/opf" version="3.0" unique-identifier="book-id">
    <metadata xmlns:dc="http://purl.org/dc/elements/1.1/">
        <dc:title>${safeTitle}</dc:title>
        <dc:identifier id="book-id">urn:uuid:${uuid}</dc:identifier>
        <dc:language>zh-CN</dc:language>
        <dc:date>${new Date().toISOString().split('T')[0]}</dc:date>
        <meta property="rendition:layout">pre-paginated</meta>
        <meta property="rendition:spread">none</meta>
        <meta property="rendition:orientation">portrait</meta>
        <meta name="generator" content="Telegra.ph Comic Downloader"/>
    </metadata>
    <manifest>
        ${manifestItems}
    </manifest>
    <spine>
        ${spineItems}
    </spine>
</package>`;

                oebps.file('content.opf', contentOpf);

                // 6. toc.ncx（EPUB 2 兼容）
                const navPoints = pageEntries.map((p, i) => `
        <navPoint id="nav${p.id}" playOrder="${i + 1}">
            <navLabel><text>第 ${i + 1} 页</text></navLabel>
            <content src="${p.href}"/>
        </navPoint>`).join('');

                const tocNcx = `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE ncx PUBLIC "-//NISO//DTD ncx 2005-1//EN" "http://www.daisy.org/z3986/2005/ncx-2005-1.dtd">
<ncx xmlns="http://www.daisy.org/z3986/2005/ncx/" version="2005-1">
    <head>
        <meta name="dtb:uid" content="urn:uuid:${uuid}"/>
        <meta name="dtb:depth" content="1"/>
        <meta name="dtb:totalPageCount" content="${total}"/>
        <meta name="dtb:maxPageNumber" content="${total}"/>
    </head>
    <docTitle><text>${safeTitle}</text></docTitle>
    <navMap>${navPoints}
    </navMap>
</ncx>`;

                oebps.file('toc.ncx', tocNcx);

                if (progressCallback) progressCallback(0.7);

                // 7. 生成
                return await zip.generateAsync(
                    {
                        type: 'blob',
                        compression: 'DEFLATE',
                        compressionOptions: { level: 6 },
                    },
                    (meta) => {
                        if (progressCallback && meta.percent) {
                            progressCallback(0.7 + (meta.percent / 100) * 0.3);
                        }
                    }
                );
            }

            // ==================== 触发下载 ====================
            function triggerDownload(blob, filename) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.rel = 'noopener';
                a.style.display = 'none';
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                    try {
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                    } catch (e) { /* 忽略 */ }
                }, 3000);
            }

            // ==================== 工具函数 ====================
            function sanitizeFilename(name) {
                if (!name || typeof name !== 'string') return 'comic';
                let safe = name
                    .replace(/[<>:"/\\|?*\x00-\x1f]/g, '')
                    .replace(/\s+/g, '_')
                    .replace(/\.{2,}/g, '.')
                    .replace(/^\.+/, '')
                    .trim();
                if (safe.length > 120) safe = safe.substring(0, 120);
                if (!safe) safe = 'comic';
                return safe;
            }

            function escapeHtml(str) {
                if (str == null) return '';
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            function escapeXml(str) {
                if (str == null) return '';
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&apos;');
            }

            function getMimeType(ext) {
                const map = {
                    'jpg': 'image/jpeg',
                    'jpeg': 'image/jpeg',
                    'png': 'image/png',
                    'gif': 'image/gif',
                    'webp': 'image/webp',
                    'bmp': 'image/bmp',
                    'svg': 'image/svg+xml',
                };
                return map[(ext || '').toLowerCase()] || 'image/jpeg';
            }

            function generateUUID() {
                if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
                    try { return crypto.randomUUID(); } catch (e) { /* 降级 */ }
                }
                return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                    const r = Math.random() * 16 | 0;
                    const v = c === 'x' ? r : (r & 0x3 | 0x8);
                    return v.toString(16);
                });
            }

            function sleep(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }

            // ==================== 初始化 ====================
            function init() {
                // 读取代理配置
                const saved = loadProxyPrefix();
                applyProxyPrefix(saved);
                if (saved) {
                    proxyInput.value = saved;
                    // 若存在代理配置，默认展开设置面板提示用户
                    settingsBody.classList.add('open');
                    settingsToggle.classList.add('open');
                }

                // 代理输入变化 → 保存
                proxyInput.addEventListener('input', () => {
                    applyProxyPrefix(proxyInput.value);
                    saveProxyPrefix(state.proxyPrefix);
                });

                // 回车触发获取
                urlInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        fetchPage();
                    }
                });

                // 初始状态
                downloadBtn.disabled = true;
                progressContainer.classList.remove('active');
                infoCard.style.display = 'none';

                console.log('%c📚 Telegra.ph 漫画下载器已就绪', 'color:#5c9ce6;font-weight:bold;');
                console.log('  支持格式: ZIP / CBZ / EPUB');
                console.log('  代理配置: ' + (state.proxyPrefix ? '已启用' : '未配置（可在高级设置中添加）'));
                console.log('  所有处理均在浏览器本地完成 ✅');
            }

            init();

            // 暴露全局函数（供 HTML onclick 使用）
            window.fetchPage = fetchPage;
            window.selectFormat = selectFormat;
            window.selectAll = selectAll;
            window.deselectAll = deselectAll;
            window.startDownload = startDownload;
            window.toggleSettings = toggleSettings;
        })();
    </script>
</body>
</html>
